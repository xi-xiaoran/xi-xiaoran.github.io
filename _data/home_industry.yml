items:
- start: Jan 2026
  end: Present
  company: Baidu
  company_logo: /images/logos/baidu_clean.png
  role: Algorithm Intern
  location: Beijing, China
  summary: Improved a production dual-encoder retrieval system by systematically analyzing
    key failure modes and contributing across post-training strategy design, data
    construction, and offline evaluation.
  bullets:
  - Systematically analyzed failure modes including term omission, term mismatch,
    semantic misunderstanding, and relevant-but-not-answerable results to guide retrieval
    optimization.
  - Developed a hard-negative enhancement framework based on mis-retrieved samples,
    together with negative loss reweighting and staged optimization, improving average
    Recall by ~10.5%.
  - Built an LLM-driven data augmentation framework with two major categories—q+u→q
    and u→q—covering four sub-pipelines for query–URL constrained semantic transfer
    and content-driven retrieval scenarios, yielding a further ~3.2% improvement in
    average Recall.
  - Introduced an offline LLM + rule-based teacher scoring mechanism for fine-grained
    supervision over candidate URL sets, and leveraged it for post-training and listwise
    optimization of the dual-encoder, driving an additional ~6.0% gain in average
    Recall.
  - Increased overall average Recall from ~60 to 72.5, corresponding to a cumulative
    relative improvement of ~20.8%, and established a full optimization loop spanning
    failure analysis, data construction, training paradigm refinement, and offline
    evaluation.
- start: May 2025
  end: Oct 2025
  company: HONOR
  company_logo: /images/logos/honor_clean.png
  role: Algorithm Intern
  location: Nanjing, Jiangsu, China
  summary: Worked on Generative Engine Optimization (GEO) for flagship products, bridging
    LLM-driven content strategy and measurable visibility.
  bullets:
  - Pushed 67 GEO articles across 13 media channels; achieved >70% AI visibility for
    14 core prompts within 6 hours.
  - Modeled AI-engine search/recommendation as a two-stage content–user query matching
    system to reverse-engineer feature priorities.
  - Built an end-to-end Python automation pipeline with a reflection–iteration mechanism;
    reduced generation time by ~40%.
  - Fine-tuned a DeepSeek-8B model with LoRA and contrastive learning to simulate
    search behavior for literature relevance evaluation.
- start: Jul 2024
  end: Dec 2024
  company: Bosch
  company_logo: /images/logos/bosch_clean.png
  role: Algorithm Intern
  location: Suzhou, Jiangsu, China
  summary: Developed data-driven automation for Ethernet gateway tooling and protocol-level
    validation.
  bullets:
  - Designed rule-based automated decision algorithms and built a gateway intelligent
    system to reduce system error rates.
  - Implemented a core parsing engine that auto-generates C++ protocol parsing code
    and an automated test framework.
  - Completed Python implementations of RTP/RTSP/RTCP and studied IEEE1588/gPTP for
    time synchronization.
  - Optimized a lightweight protobuf library and improved accuracy from 98.4% to 100%.
- start: Jan 2024
  end: Feb 2024
  company: Industrial and Commercial Bank of China (ICBC)
  company_logo: /images/logos/icbc_clean.png
  role: Algorithm Intern
  location: Changzhou, Jiangsu, China
  summary: Built ML-based credit and risk assessment prototypes with structured data
    pipelines.
  bullets:
  - Integrated multi-source customer data and standardized preprocessing workflows
    for consistency and availability.
  - Designed an intelligent loan issuance assessment model reaching ~72% accuracy.
  - Developed an LSTM–Transformer time-series model achieving ~89% AUC and early risk
    identification.
