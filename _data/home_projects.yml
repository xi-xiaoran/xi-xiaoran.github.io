- title: CP31 Ticket Snatcher
  logo: /images/logos/cp31.png
  keywords:
  - Python
  - Automation
  - Web Interaction
  teaser: An automation toolkit designed to improve the success rate of convention ticket purchasing under heavy competition.
  details: 'Built for real-world ticketing bottlenecks such as queue congestion and rapid sell-out scenarios.


    Designed as a practical automation toolkit for anime convention ticket purchasing under extreme contention.'
  link: https://github.com/xi-xiaoran/CP31-ticket-grabbing
  github_repo: xi-xiaoran/CP31-ticket-grabbing
- title: BUTR
  logo: /images/papers/butr_teaser.png
  keywords:
  - Medical Imaging
  - Retinal Vessel Segmentation
  - Topology Repair
  - Uncertainty
  teaser: A plug-and-play post-hoc framework that combines evidential uncertainty and structure-violation cues for budgeted local repair in retinal vessel segmentation.
  details: Constructs a compact ROI under an edit budget by fusing uncertainty with topology-violation signals, then applies lightweight ROI-constrained logit refinement for minimal and targeted structural correction. Serves as the codebase accompanying the MICCAI 2026 under-review manuscript.
  link: https://github.com/xi-xiaoran/BUTR
  github_repo: xi-xiaoran/BUTR
- title: Meta-Policy Controller (MPC)
  logo: /images/logos/rl_edl.png
  keywords:
  - Reinforcement Learning
  - Meta-Learning
  - Calibration
  - EDL
  teaser: A bi-level meta-policy system that learns dynamic uncertainty calibration strategies for evidential models.
  details: 'Uses a policy network to optimize KL coefficients and class-wise Dirichlet prior strengths.

    Aims to unify accuracy and uncertainty quality under a single adaptive optimization framework.

    Serves as the codebase accompanying the arXiv/CVPR under-review manuscript.

    '
  link: https://github.com/xi-xiaoran/Meta-Policy-Controller
  github_repo: xi-xiaoran/Meta-Policy-Controller
- title: Evidential U-KAN
  logo: /images/logos/medical_ai.png
  keywords:
  - Medical Imaging
  - Segmentation
  - EDL
  - Uncertainty
  teaser: A trustworthy medical segmentation framework integrating progressive uncertainty-guided attention and semantic-preserving evidence learning.
  details: 'Combines PEUA and SAEL to enhance boundary precision and preserve clinically meaningful semantics.

    Demonstrates strong accuracy–reliability trade-offs across multiple public polyp datasets.

    Serves as the codebase accompanying the arXiv preprint.

    '
  link: https://github.com/xi-xiaoran/Evidential-U-KAN
  github_repo: xi-xiaoran/Evidential-U-KAN
